<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>D' Real Z Early Wireframe</title>
    <style>
        body {
            margin: 0;
            background: #f4f4f5;
            color: #18181b;
            font-family: Arial, sans-serif;
        }

        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .bar,
        .box,
        .card {
            border: 2px dashed #a1a1aa;
            background: #fff;
        }

        .bar {
            height: 72px;
            margin-bottom: 24px;
        }

        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .box {
            min-height: 280px;
            padding: 24px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .card {
            min-height: 160px;
            padding: 18px;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 42px;
        }

        p {
            color: #52525b;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="bar"></div>

        <section class="hero">
            <div class="box">
                <h1>Early Landing Page Layout</h1>
                <p>Basic wireframe before final styling, responsive spacing, real product images, reusable components, and polished visual hierarchy.</p>
            </div>

            <div class="box">
                <p>Product image / brand mockup placeholder</p>
            </div>
        </section>

        <section class="cards">
            <div class="card">Feature card</div>
            <div class="card">Product card</div>
            <div class="card">Pricing card</div>
        </section>
    </main>
</body>
</html>
